<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#151F28"/>
    <stop offset="100%" stop-color="#0A121A"/>
  </linearGradient>
  <radialGradient id="beaconGlow" cx="50%" cy="38%" r="55%">
    <stop offset="0%" stop-color="#3C8FDD" stop-opacity="0.32"/>
    <stop offset="50%" stop-color="#125DA3" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0A121A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3C8FDD" stop-opacity="0.85"/>
    <stop offset="40%" stop-color="#3C8FDD" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#3C8FDD" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Foundation Surface -->
<rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
<rect width="512" height="512" rx="112" fill="url(#beaconGlow)"/>

<!-- Signal Beam -->
