<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
<defs>
  <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0A121A"/>
    <stop offset="50%" stop-color="#151F28"/>
    <stop offset="100%" stop-color="#0A121A"/>
  </linearGradient>
  <radialGradient id="bannerGlow" cx="78%" cy="42%" r="48%">
    <stop offset="0%" stop-color="#3C8FDD" stop-opacity="0.28"/>
    <stop offset="50%" stop-color="#125DA3" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0A121A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bannerBeam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3C8FDD" stop-opacity="0.85"/>
    <stop offset="50%" stop-color="#3C8FDD" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#3C8FDD" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#151F28" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0E2942" stop-opacity="0.6"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1600" height="480" fill="url(#bannerBg)"/>
<rect width="1600" height="480" fill="url(#bannerGlow)"/>

<!-- Architectural Grid -->
<g opacity="0.07" stroke="#F7F5ED" stroke-width="1">
  <path d="M0 80H1600 M0 160H1600 M0 240H1600 M0 320H1600 M0 400H1600"/>
  <path d="M160 0V480 M320 0V480 M480 0V480 M640 0V480 M800 0V480 M960 0V480 M1120 0V480 M1280 0V480 M1440 0V480"/>
</g>

<!-- Beacon Graphic on Right -->
<g transform="translate(1060, 60)">
  <!-- Signal Light Beam -->
  <path d="M210 120 L510 50 L510 190 L210 145 Z" fill="url(#bannerBeam)"/>

  <!-- Light Flare -->
  <circle cx="210" cy="132" r="32" fill="#3C8FDD" opacity="0.35"/>
  <circle cx="210" cy="132" r="14" fill="#F7F5ED"/>

  <!-- Tower Structure -->
  <!-- Base -->
  <path d="M125 350 h170 v16 h-170 z" fill="#29526C"/>
  <path d="M140 336 h140 v14 h-140 z" fill="#151F28"/>

  <!-- Tower Shaft -->
  <path d="M152 178 h116 l-14 158 h-88 z" fill="#F7F5ED"/>
  <path d="M160 236 h100 l-6 44 h-88 z" fill="#0E2942"/>

  <!-- Balcony -->
  <path d="M136 168 h148 v10 h-148 z" fill="#29526C"/>

  <!-- Lantern Room -->
  <path d="M154 116 h112 v52 h-112 z" fill="#0E2942"/>
  <path d="M192 116 h36 v52 h-36 z" fill="#3C8FDD" opacity="0.95"/>
  <path d="M206 116 h8 v52 h-8 z" fill="#F7F5ED"/>

  <!-- Dome Roof -->
  <path d="M144 116 h132 l-26 -36 h-80 z" fill="#F7F5ED"/>

  <!-- Mast / Finial -->
  <path d="M206 56 h8 v24 h-8 z" fill="#F7F5ED"/>
  <circle cx="210" cy="52" r="6" fill="#3C8FDD"/>
</g>

<!-- Left Content Block -->
<g transform="translate(120, 96)">
  <!-- Badge Pill -->
  <rect x="0" y="0" width="280" height="34" rx="17" fill="url(#cardBg)" stroke="#3C8FDD" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="18" cy="17" r="5" fill="#3C8FDD"/>
  <text x="32" y="22" fill="#B3D0EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">NATIVE ANDROID · VENICE AI</text>

  <!-- Title -->
  <text x="0" y="112" fill="#F7F5ED" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5">Venice Fyr</text>

  <!-- Subtitle -->
  <text x="4" y="162" fill="#B3D0EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="22" font-weight="500">Native Kotlin &amp; Jetpack Compose client and reusable SDK for Venice AI</text>
  
  <!-- Description -->
  <text x="4" y="206" fill="#6E7176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="16">Privacy-first mobile architecture · Hardware-backed keystore · Zero raw logging</text>

  <!-- Accent Rule -->
  <rect x="4" y="246" width="120" height="4" rx="2" fill="#3C8FDD"/>
  <rect x="132" y="246" width="48" height="4" rx="2" fill="#29526C"/>
  <rect x="188" y="246" width="24" height="4" rx="2" fill="#6E7176"/>
</g>
</svg>